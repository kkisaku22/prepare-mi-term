<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Budget Tracker</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; }
.container-box { background:white; padding:25px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
h1 { font-weight:bold; }
.list-group-item { display:flex; justify-content:space-between; align-items:center; }
.item-info { font-size:16px; }
button { margin-left:5px; }
</style>
</head>
<body>

<div class="container my-5">
  <div class="container-box">
    <h1 class="text-center mb-4">Mini Budget Tracker</h1>

    <!-- README BUTTON -->
    <div class="text-center mb-4">
      <a href="https://github.com/kkisaku22/CIS-Silver/blob/main/README.md" target="_blank" class="btn btn-outline-dark">📖 Read Project Documentation</a>
    </div>

    <!-- FORM -->
    <form id="itemForm" class="row g-2">
      <div class="col-md-3"><input type="text" class="form-control" id="title" placeholder="Title" required></div>
      <div class="col-md-2"><input type="number" class="form-control" id="amount" placeholder="Amount" required></div>
      <div class="col-md-3"><input type="text" class="form-control" id="category" placeholder="Category" required></div>
      <div class="col-md-2"><input type="date" class="form-control" id="date" placeholder="Date" required></div>
      <div class="col-md-2"><button type="submit" class="btn btn-primary w-100" id="submitBtn">Add Item</button></div>
    </form>

    <hr>
    <!-- ITEMS LIST -->
    <div id="itemsList" class="list-group"></div>
  </div>
</div>

<script>
let editingId = null;

// ---------------- LOAD ITEMS ----------------
async function loadItems() {
  const list = document.getElementById("itemsList");
  list.innerHTML = "";
  const res = await fetch("/api/items");
  const items = await res.json();
  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "list-group-item d-flex justify-content-between align-items-center";
    div.innerHTML = `
      <div class="item-info">
        <strong>${item.title}</strong> - $${item.amount} (${item.category}) - ${item.date}
      </div>
      <div>
        <button class="btn btn-warning btn-sm editBtn">Edit</button>
        <button class="btn btn-danger btn-sm deleteBtn">Delete</button>
      </div>
    `;
    // Edit button
    div.querySelector(".editBtn").onclick = () => {
      editingId = item._id;
      document.getElementById("title").value = item.title;
      document.getElementById("amount").value = item.amount;
      document.getElementById("category").value = item.category;
      document.getElementById("date").value = item.date;
      document.getElementById("submitBtn").innerText = "Update Item";
    };
    // Delete button
    div.querySelector(".deleteBtn").onclick = async () => {
      await fetch(`/api/items/${item._id}`, { method: "DELETE" });
      loadItems();
    };
    list.appendChild(div);
  });
}

loadItems();

// ---------------- ADD OR UPDATE ----------------
document.getElementById("itemForm").addEventListener("submit", async e => {
  e.preventDefault();
  const payload = {
    title: document.getElementById("title").value,
    amount: document.getElementById("amount").value,
    category: document.getElementById("category").value,
    date: document.getElementById("date").value
  };

  if (editingId) {
    await fetch(`/api/items/${editingId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    editingId = null;
    document.getElementById("submitBtn").innerText = "Add Item";
  } else {
    await fetch("/api/items", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  }

  document.getElementById("itemForm").reset();
  loadItems();
});
</script>

</body>
</html>
